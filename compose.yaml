# Local trial of Driver Hub: the manager with its web frontend, on http://localhost:8080.
# Before the first start, set the first administrator's password (at least 12 characters) in a
# .env file next to this file:  DRIVER_HUB_INITIAL_PASSWORD=choose-a-long-password
# See "Try it locally" in README.md.
name: driver-hub-trial

services:
  manager:
    build: .
    image: driver-hub:local
    ports:
      # Plain HTTP is only accepted on localhost; the session cookie is Secure.
      - '127.0.0.1:8080:8080'
    # Every setting the manager reads, set to its default. A commented-out setting has no default
    # and stays off until you set it: uncomment it rather than leaving it empty. Keep secrets in the
    # .env file and refer to them as ${NAME}. OPERATIONS.md describes each setting in more detail.
    environment:
      # --- Network -------------------------------------------------------------------------------
      # Address and port the manager listens on inside the container. If you change PORT, change
      # the second port under "ports" above to match.
      HOST: 0.0.0.0
      PORT: '8080'

      # --- Storage -------------------------------------------------------------------------------
      # Retained releases, accounts, site settings, device names and the activity journal. Back it
      # up, and let only one manager use it at a time.
      DRIVER_HUB_DATA_DIR: /data
      # Verified driver images, which Nomad clients pull through the image service. The image
      # service (node src/serve-images.js) is not part of this file; it needs read access to the
      # same directory.
      DRIVER_HUB_IMAGES_DIR: /data/images
      # The built web frontend. Without an index.html there, the manager serves only the API.
      DRIVER_HUB_WEB_DIR: /app/web/build
      # A file of exactly 32 random bytes that encrypts the saved site settings. Unset, the key is
      # created next to the settings in DRIVER_HUB_DATA_DIR. Set it before the first setup:
      # changing it later makes the saved settings unreadable.
      # DRIVER_HUB_SITE_KEY_FILE: /run/secrets/site-key

      # --- First administrator -------------------------------------------------------------------
      # Used only while there are no accounts yet; it never resets an existing password.
      DRIVER_HUB_BOOTSTRAP_USERNAME: admin
      DRIVER_HUB_BOOTSTRAP_PASSWORD_FILE: /run/secrets/initial-password

      # --- API access for scripts ----------------------------------------------------------------
      # A request with "Authorization: Bearer <token>" gets administrator or read-only access
      # without signing in. Unset, the API accepts signed-in users only.
      # DRIVER_HUB_ADMIN_TOKEN: ${DRIVER_HUB_ADMIN_TOKEN}
      # DRIVER_HUB_VIEWER_TOKEN: ${DRIVER_HUB_VIEWER_TOKEN}

      # --- Nomad ---------------------------------------------------------------------------------
      # Starting values for Site > Nomad cluster. They apply only until site settings are first
      # saved in the web interface (Nomad or VideoIPath); from then on the saved settings are used.
      # Unset NOMAD_ADDR, Hub has no cluster until one is entered there.
      # NOMAD_ADDR: https://nomad.site.example:4646
      # NOMAD_TOKEN: ${NOMAD_TOKEN}
      NOMAD_NAMESPACE: default
      # Comma-separated.
      NOMAD_DATACENTERS: dc1
      # Host name, optionally with a port, of the image service as Nomad clients reach it. No
      # scheme or path. Needed before Hub can stage or update devices.
      # DRIVER_HUB_IMAGE_HOST: driver-images.site.example
      # HTTPS address of the Nomad web interface. Adds links to allocation logs on device pages.
      # DRIVER_HUB_NOMAD_UI_ORIGIN: https://nomad.site.example
      # 'true' if another process may edit Hub's Nomad jobs directly. Hub then never purges a job
      # when a deployment is deleted, because a purge cannot check that the job is unchanged.
      DRIVER_HUB_NOMAD_SHARED_WRITERS: 'false'
      # 'true' adds a Server-Timing header to API responses, with the request's duration and its
      # Nomad calls. For diagnosing slow pages.
      DRIVER_HUB_NOMAD_TIMINGS: 'false'

      # --- Source builds -------------------------------------------------------------------------
      # 'true' lets administrators build drivers from the public repository. Also needs the image's
      # builder target (add "target: builder" under "build") and a Docker daemon with Buildx.
      DRIVER_HUB_BUILDS: 'false'
    secrets:
      - source: initial-password
        # Readable by the manager's service user (UID 1000).
        uid: '1000'
        mode: 0400
    volumes:
      - data:/data
    restart: unless-stopped

secrets:
  initial-password:
    # Copied into the container as a file; the manager never sees it as an environment variable.
    # Only used to create the first account while the data volume is empty.
    environment: DRIVER_HUB_INITIAL_PASSWORD

volumes:
  data:
