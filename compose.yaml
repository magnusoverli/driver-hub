# Deploy Driver Hub from a release image: docker compose pull && docker compose up -d
# No .env is needed to start. This file starts the latest Driver Hub release, and
# docker compose pull && docker compose up -d upgrades to a newer one. The copy attached to each
# release instead stays on that exact release. To change a setting, create .env next to this file
# with only the lines you need:
#
#   DRIVER_HUB_LISTEN_ADDRESS=127.0.0.1         # web interface on this machine only
#   DRIVER_HUB_ALLOW_PLAIN_HTTP=false           # behind HTTPS: keep the session cookie Secure
#   DRIVER_HUB_DISTRIBUTION_ADDRESS=10.0.0.5    # how Nomad clients reach this machine
#   DRIVER_HUB_IMAGE=ghcr.io/magnusoverli/driver-hub:vX.Y.Z   # stay on one release
#
# Keep the original project name so upgrades reuse the existing data volume.
name: driver-hub-trial

services:
  manager:
    image: ${DRIVER_HUB_IMAGE:-ghcr.io/magnusoverli/driver-hub:latest}
    depends_on:
      buildkit:
        condition: service_healthy
        required: false
    ports:
      # Web interface and API, on every network interface of this machine. Set
      # DRIVER_HUB_LISTEN_ADDRESS=127.0.0.1 to keep it local, for example behind an HTTPS proxy here.
      - '${DRIVER_HUB_LISTEN_ADDRESS:-0.0.0.0}:8080:8080'
      # Nomad clients fetch the image-service package and verified driver images here (read-only HTTP).
      - '5481:5481'
    # The settings the manager needs before its web interface runs, set to their defaults. Everything
    # else (the Nomad cluster, VideoIPath, source builds, API tokens) is set in the web
    # interface under Settings, which also lists the values below as Settings > Manager shows them.
    # A commented-out setting has no default and stays off until you set it: uncomment it rather
    # than leaving it empty. Keep secrets in the .env file and refer to them as ${NAME}. Changes
    # here take effect when the manager restarts. OPERATIONS.md describes each setting in detail.
    environment:
      # --- Network -------------------------------------------------------------------------------
      # Address and port the manager listens on inside the container. If you change PORT, change
      # the second port under "ports" above to match.
      HOST: 0.0.0.0
      PORT: '8080'
      # 'true' (the default) lets browsers on other machines sign in over plain http://, so
      # passwords and sessions cross the network unencrypted: use it on trusted networks only.
      # Behind an HTTPS reverse proxy, set 'false' so the session cookie is Secure.
      DRIVER_HUB_ALLOW_PLAIN_HTTP: ${DRIVER_HUB_ALLOW_PLAIN_HTTP:-true}

      # --- Image distribution --------------------------------------------------------------------
      # Hub runs an image service on every Nomad client by itself, once the Nomad cluster is set up
      # under Settings. The clients fetch images from the manager on this port. If you change it,
      # change the last port under "ports" above to match.
      DRIVER_HUB_DISTRIBUTION_PORT: '5481'
      # The address at which Nomad clients reach this machine. Needed here because inside the
      # container Hub only sees its own container address. Without a Nomad cluster it is unused.
      DRIVER_HUB_DISTRIBUTION_ADDRESS: ${DRIVER_HUB_DISTRIBUTION_ADDRESS:-}

      # --- Storage -------------------------------------------------------------------------------
      # Retained releases, verified images, accounts, site settings, device names and the activity
      # journal. Back it up, and let only one manager use it at a time.
      DRIVER_HUB_DATA_DIR: /data
      # The built web frontend. Without an index.html there, the manager serves only the API.
      DRIVER_HUB_WEB_DIR: /app/web/build
      # A file of exactly 32 random bytes that encrypts the saved site settings. Unset, the key is
      # created next to the settings in DRIVER_HUB_DATA_DIR. Set it before the first setup:
      # changing it later makes the saved settings unreadable.
      # DRIVER_HUB_SITE_KEY_FILE: /run/secrets/site-key

      # --- First administrator -------------------------------------------------------------------
      # Used only while there are no accounts yet; it never resets an existing password.
      DRIVER_HUB_BOOTSTRAP_USERNAME: admin
      # Optional alternative to the default password: mount a private file readable by UID 1000.
      # DRIVER_HUB_BOOTSTRAP_PASSWORD_FILE: /run/secrets/initial-password

      # --- Emergency access ----------------------------------------------------------------------
      # A request with "Authorization: Bearer <token>" gets administrator access without signing
      # in, even when every administrator account is locked out. Scripts should use API tokens
      # created under Settings > API tokens instead, which can be revoked one by one.
      # DRIVER_HUB_ADMIN_TOKEN: ${DRIVER_HUB_ADMIN_TOKEN}

      # The builder is available at startup; administrators opt in under Settings > Manager.
      BUILDX_BUILDER: hub-compose
    volumes:
      - data:/data
      - type: volume
        source: buildkit-socket
        target: /run/hub-buildkit
        read_only: true
        volume:
          nocopy: true
    restart: unless-stopped

  buildkit:
    image: moby/buildkit:v0.35.1-rootless@sha256:7d02292556e66feea6d2d89b7ec143503b57e4f59a4efc6b7ece8547e4d3e5be
    # Rootless BuildKit needs nested user namespaces, mounts and a separate /proc for build steps.
    security_opt:
      - seccomp=unconfined
      - apparmor=${DRIVER_HUB_BUILDKIT_APPARMOR:-unconfined}
      - systempaths=unconfined
    volumes:
      - buildkit-socket:/run/user/1000
      - buildkit-cache:/home/user/.local/share/buildkit
    healthcheck:
      test: ["CMD", "buildctl", "--addr", "unix:///run/user/1000/buildkit/buildkitd.sock", "debug", "workers"]
      interval: 5s
      timeout: 3s
      retries: 6
    restart: unless-stopped

volumes:
  data:
  buildkit-socket:
  buildkit-cache:
